[advisories]
version = 2
ignore = [
    # quick-xml is pulled in only as a build-only transitive dependency of
    # wayland-scanner (via winit/iced). The vulnerable NsReader API is
    # not used by Rutile code.
    { id = "RUSTSEC-2026-0195", reason = "build-only transitive dependency; vulnerable API not used" },
    { id = "RUSTSEC-2026-0194", reason = "build-only transitive dependency; vulnerable API not used" },
    # gtk-rs GTK3 bindings are unmaintained. Rutile intentionally uses
    # GTK3/WebKitGTK on Linux; migration to GTK4 is out of scope.
    { id = "RUSTSEC-2024-0413", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0416", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0412", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0418", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0415", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0420", reason = "intentional GTK3 binding" },
    { id = "RUSTSEC-2024-0419", reason = "intentional GTK3 binding" },
    # proc-macro-error is unmaintained; reached transitively via glib-macros from
    # the GTK3/WebKitGTK stack that wry resolves into the lockfile. Advisory
    # reports no safe upgrade; Rutile does not depend on its macro surface.
    { id = "RUSTSEC-2024-0370", reason = "transitive via GTK3 glib-macros; no safe upgrade" },
    # ttf-parser is unmaintained; reached transitively via cosmic-text (iced) and
    # ab_glyph (winit). Rutile renders with system fonts via the GUI stack;
    # advisory reports no safe upgrade.
    { id = "RUSTSEC-2026-0192", reason = "transitive via iced cosmic-text/ab_glyph; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "MPL-2.0", "BSL-1.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known structural GUI-stack duplicate versions (iced-0.14/objc2-0.2 vs
# wry-0.55/objc2-0.3 split + Windows-target platform artifacts from the unified
# lockfile). Version-scoped: NEW duplicate versions still warn. Retire via the
# GUI-stack unification ticket (docs/plan/gui-stack-unification.md).
skip = [
    { name = "bitflags", version = "1.3.2" },
    { name = "block2", version = "0.5.1" },
    { name = "calloop", version = "0.13.0" },
    { name = "calloop-wayland-source", version = "0.3.0" },
    { name = "font-types", version = "0.10.1" },
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.3" },
    { name = "heck", version = "0.4.1" },
    { name = "jni", version = "0.21.1" },
    { name = "jni-sys", version = "0.3.1" },
    { name = "linux-raw-sys", version = "0.4.15" },
    { name = "objc2", version = "0.5.2" },
    { name = "objc2-app-kit", version = "0.2.2" },
    { name = "objc2-foundation", version = "0.2.2" },
    { name = "objc2-ui-kit", version = "0.2.2" },
    { name = "proc-macro-crate", version = "1.3.1" },
    { name = "r-efi", version = "5.3.0" },
    { name = "read-fonts", version = "0.35.0" },
