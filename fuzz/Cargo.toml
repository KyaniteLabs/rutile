[package]
name = "feathermark-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
feathermark-protocol = { path = "../crates/feathermark-protocol" }
libfuzzer-sys = "=0.4.10"

[[bin]]
name = "render_markdown"
path = "fuzz_targets/render_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_blocks"
path = "fuzz_targets/source_blocks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "preview_event"
path = "fuzz_targets/preview_event.rs"
test = false
doc = false
bench = false

[workspace]
members = []
