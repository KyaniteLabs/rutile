[package]
name = "feathermark-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
feathermark-core = { path = "../crates/feathermark-core", version = "=0.2.0" }
feathermark-protocol = { path = "../crates/feathermark-protocol", version = "=0.2.0" }
feathermark-types = { path = "../crates/feathermark-types", version = "=0.2.0" }
html-escape = "=0.2.13"
libfuzzer-sys = "=0.4.10"

[[bin]]
name = "preview_event"
path = "fuzz_targets/preview_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_markdown"
path = "fuzz_targets/render_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_blocks"
path = "fuzz_targets/source_blocks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_to_markdown"
path = "fuzz_targets/html_to_markdown.rs"
test = false
doc = false
bench = false

[workspace]
members = []

[patch.crates-io]
pulldown-cmark = { path = "../vendor/pulldown-cmark" }
