[package]
name = "rutile-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
rutile-core = { path = "../crates/rutile-core", version = "=0.2.2" }
rutile-protocol = { path = "../crates/rutile-protocol", version = "=0.2.2" }
rutile-types = { path = "../crates/rutile-types", version = "=0.2.2" }
html-escape = "=0.2.13"
libfuzzer-sys = "=0.4.10"

[[bin]]
name = "preview_event"
path = "fuzz_targets/preview_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_markdown"
path = "fuzz_targets/render_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_blocks"
path = "fuzz_targets/source_blocks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_to_markdown"
path = "fuzz_targets/html_to_markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "export_page"
path = "fuzz_targets/export_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "autosave_session"
path = "fuzz_targets/autosave_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_save_state"
path = "fuzz_targets/file_save_state.rs"
test = false
doc = false
bench = false

[workspace]
members = []

[patch.crates-io]
pulldown-cmark = { path = "../vendor/pulldown-cmark" }
