[package]
name = "rutile-app"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "rutile"
path = "src/main.rs"

[features]
default = []
linux-gtk = ["dep:gtk", "dep:sourceview4", "dep:wry"]
macos-shell = ["dep:iced_renderer", "dep:iced_widget", "dep:iced_winit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:raw-window-handle", "dep:wry"]
test-control = []

[dependencies]
rutile-core = { path = "../rutile-core", version = "=0.2.2" }
rutile-protocol = { path = "../rutile-protocol", version = "=0.2.2" }
rutile-types = { path = "../rutile-types", version = "=0.2.2" }
getrandom = "=0.3.3"
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
url = "=2.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
sourceview4 = { version = "=0.5.0", optional = true }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
iced_renderer = { version = "=0.14.0", features = ["tiny-skia"], optional = true }
iced_widget = { version = "=0.14.0", optional = true }
iced_winit = { version = "=0.14.0", optional = true }
objc2 = { version = "=0.6.4", optional = true }
# NSAccessibility bridge (CY-A11Y-001): NSAccessibility + NSAccessibilityConstants
# + NSAccessibilityProtocols expose the role/label/value/children setters;
# NSAccessibilityElement is the AppKit class for peer/child AX elements that are
# not real NSViews (the iced editor/toolbar/notice are drawn by tiny-skia).
# NSEvent (in the feature list below) supplies event-time modifier flags
# (NSEvent::modifierFlags_class) so the key dispatcher can reconcile winit's
# tracked ModifiersState against the AppKit truth after focus transitions
# involving the non-activating palette panel.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAlert", "NSApplication", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSSavePanel", "NSTextField", "NSView", "NSWindow"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"], optional = true }
# raw-window-handle reaches the content NSView of the winit window so
# NSAccessibility attributes can be published onto it. Pinned to 0.6.2 to match
# the version winit 0.30 already resolves in the lockfile.
raw-window-handle = { version = "=0.6.2", optional = true }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"], optional = true }
