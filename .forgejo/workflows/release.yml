# SPDX-License-Identifier: MIT
#
# Rutile release pipeline (Forgejo Actions / GitHub Actions compatible).
#
# Triggers ONLY from a protected clean v* tag. It re-runs the entire verify
# pipeline at release profile on the exact tagged commit (so shipped artifacts
# passed release-profile gates on the tag's tree), then guards that the tag
# commit/tree match the checked-out HEAD exactly and that the tree is clean,
# generates and binds provenance, and retains raw logs + machine-readable
# evidence.
#
# Required-check enforcement from verify.yml is additionally bound through
# branch protection (status checks); that wiring is recorded in wiring_needed.
#
# Jobs marked "needs: external" require an authenticated runner or a signing
# identity that cannot be auto-provisioned; the provenance job fails closed
# (listing hard blockers) until the Phase B provenance keystone and manual owner
# approval are in place.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  FORGEJO_RUNNER_NAME: ${{ vars.FORGEJO_RUNNER_NAME || '' }}

jobs:
  # 1. Guard the tag: must be v*, clean, exact commit/tree match.
  tag-guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: assert protected clean v* tag with exact commit/tree match
        id: identity
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          case "$tag" in
            v*) ;;
            *) echo "release: refusing non-v* tag: $tag" >&2; exit 2 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "release: HEAD ($head_commit) != tag commit ($tag_commit)" >&2
            exit 2
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "release: working tree is dirty" >&2
            exit 2
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          # Require the tagged commit to be reachable from the protected branch
          # tip (main), so a tag on an unmerged commit cannot ship.
          if ! git merge-base --is-ancestor "$head_commit" origin/main; then
            echo "release: tagged commit is not an ancestor of origin/main" >&2
            exit 2
          fi
          echo "release: tag=$tag commit=$head_commit tree=$tree (clean, on main)"

  # 2. Re-run the full verify pipeline at release profile on the tagged tree.
  #    verify.yml gates emit rutile.gate-result.v1 under target/evidence/.
  verify-release:
    needs: tag-guard
    uses: ./.forgejo/workflows/verify.yml
    with:
      profile: release
    # Required-status-check enforcement for the v* branch is additionally bound
    # through branch protection; see wiring_needed.

  # 3. Clean packages from the tagged clean tree (exact commit/tree match).
  release-package:
    # needs: external — packaging runner per kind; signing identity external.
    needs: [tag-guard, verify-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: macos
            features: macos-shell
            runs-on: [self-hosted, macos, arm64]
          - kind: linux
            features: linux-gtk
            runs-on: [self-hosted, linux, x11]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-guard.outputs.commit }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: assert exact tagged commit/tree
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${{ needs.tag-guard.outputs.commit }}" ] || { echo "commit mismatch"; exit 2; }
          [ "$(git rev-parse 'HEAD^{tree}')" = "${{ needs.tag-guard.outputs.tree }}" ] || { echo "tree mismatch"; exit 2; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo "dirty tree"; exit 2; }
      - name: bootstrap toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: build featured release candidate from clean tree
        run: cargo build --locked --release -p rutile-app --features ${{ matrix.features }} --bin rutile
      - name: package + inspect (release)
        run: |
          bash scripts/ci/package-inspect.sh \
            --candidate target/release/rutile \
            --kind ${{ matrix.kind }} \
            --profile release \
            --job release-package-${{ matrix.kind }}
      - name: retain packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.kind }}
          path: target/evidence/**/packages/
          if-no-files-found: warn
          retention-days: 365
      - name: retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-package-${{ matrix.kind }}
          path: target/evidence/
          if-no-files-found: error
          retention-days: 365

  # 4. Independent readiness attestation + runner verification + provenance
  #    validation. This job consumes three EXTERNAL inputs that cannot be
  #    fabricated in CI and fails closed if any is absent:
  #      - PROVENANCE_INPUT: a real G005 production-provenance record
  #        (rutile.production-provenance.v1) generated externally for the exact
  #        tagged source. Validated against the checked-out tag before upload.
  #      - READINESS_ATTESTATION_INPUT: an independent readiness attestation
  #        signed by the trusted verifier. Absent until G004 provisions the key.
  #      - PREFLIGHT_INPUT: an attested release-prerequisite-preflight inventory.
  #    It also captures the five-runner enrollment matrix
  #    (`xtask runner capture-verify-matrix`; fails closed Unprovisioned),
  #    verifies + publishes the readiness attestation (`xtask readiness
  #    verify/publish`; never signs, never authorizes publication), validates
  #    the provenance against the tag (`xtask evidence validate`), and validates
  #    the preflight inventory (`xtask release-preflight`).
  #    publication_authorized remains false throughout. No tags, uploads, or
  #    public release steps exist in this workflow.
  provenance:
    # needs: external — signing identity, provisioned runners (G004),
    # trusted-verifier key (G004), G005 provenance generator, and owner approval.
    needs: [tag-guard, release-package]
    runs-on: ubuntu-latest
    env:
      # Real externally generated G005 production-provenance record for the
      # exact tagged source. Generated outside CI from the tagged clean tree
      # (never fabricated headless here). Absent → fail closed.
      PROVENANCE_INPUT: release/evidence/provenance/production-provenance.json
      # Canonical attested inventory path; the owner regenerates it for the tag.
      PREFLIGHT_INPUT: release/evidence/release-prerequisite-preflight-v1.json
      # Independent readiness attestation supplied by the trusted verifier
      # (rutile.readiness-attestation.v1). Absent until G004 provisions the
      # trusted-verifier key and the verifier signs; readiness verify fails
      # closed on absence.
      READINESS_ATTESTATION_INPUT: release/evidence/readiness-attestation-v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-guard.outputs.commit }}
          fetch-depth: 0
      - name: bootstrap toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: validate external production provenance (fails closed if absent)
        # The G005 production-provenance record is generated externally from
        # the exact tagged source — never fabricated in this pipeline. This
        # step validates it against the rutile.production-provenance.v1 schema
        # and fails closed if the file is absent, unreadable, or schema-invalid.
        # The provenance is later passed to evidence-finalize.sh --provenance
        # so evidence bind can anchor the canonical evidence index to it.
        run: |
          set -euo pipefail
          if [ ! -f "$PROVENANCE_INPUT" ]; then
            echo "release: no production provenance at $PROVENANCE_INPUT (G005 externally generated provenance required for this exact tag)" >&2
            exit 2
          fi
          cargo run --locked -p xtask --bin xtask -- evidence validate \
            --input "$PROVENANCE_INPUT" \
            --schema production-provenance
      - name: capture + verify runner enrollment matrix (fails closed)
        # `xtask runner capture-verify-matrix` dispatches the five enrollment
        # probes and commits the offline-verifiable runner lock. Fails closed
        # (RunnerError::Unprovisioned) until G004 provisions the two trust
        # manifests under xtask/. The runner lock is the --runner-lock input to
        # readiness verify/publish below.
        run: |
          set -euo pipefail
          mkdir -p release/evidence/runner target/runner-captures
          cargo run --locked -p xtask --bin xtask -- runner capture-verify-matrix \
            --runners fm-macos-arm64-v1,fm-macos-x86_64-v1,fm-ubuntu-x11-v1,fm-ubuntu-wayland-v1,fm-fedora-wayland-v1 \
            --capture-dir target/runner-captures \
            --out release/evidence/runner/runner-lock-v1.json
      - name: verify independent readiness attestation (fails closed)
        # `xtask readiness verify` checks the attestation's signature against
        # the pinned trusted-verifier public key
        # (release/keys/trusted-verifier-v1.pub.hex) and cross-binds its source
        # to the checked-out tag + the runner lock. Never signs, never reads a
        # secret, never authorizes publication. Fails closed until G004
        # provisions the key and the independent verifier signs.
        run: |
          set -euo pipefail
          if [ ! -f "$READINESS_ATTESTATION_INPUT" ]; then
            echo "release: no readiness attestation at $READINESS_ATTESTATION_INPUT (G004 trusted-verifier key + independent verifier signature required)" >&2
            exit 2
          fi
          cargo run --locked -p xtask --bin xtask -- readiness verify \
            --input "$READINESS_ATTESTATION_INPUT" \
            --runner-lock release/evidence/runner/runner-lock-v1.json
      - name: publish readiness attestation (create-only; never signs)
        # `xtask readiness publish` writes a create-only canonical copy of the
        # verified attestation. publication_authorized stays false; this step
        # emits the attestation for reviewers, it does not authorize release.
        run: |
          set -euo pipefail
          mkdir -p release/evidence/readiness
          cargo run --locked -p xtask --bin xtask -- readiness publish \
            --input "$READINESS_ATTESTATION_INPUT" \
            --runner-lock release/evidence/runner/runner-lock-v1.json \
            --out release/evidence/readiness/readiness-attestation-published-v1.json
      - name: validate attested preflight inventory (real command; fails closed)
        # release-preflight parses the full rutile.release-prerequisite-preflight.v1
        # document, asserts its source commit/tree match the checked-out tag
        # exactly, and reports readiness. Until the owner regenerates a matching
        # inventory and approves the protected tag, this step exits non-zero
        # and blocks publication of the release.
        run: |
          set -euo pipefail
          if [ ! -f "$PREFLIGHT_INPUT" ]; then
            echo "release: no attested preflight inventory at $PREFLIGHT_INPUT (owner must regenerate for this tag)" >&2
            exit 2
          fi
          mkdir -p release/evidence/provenance
          cargo run --locked -p xtask --bin xtask -- release-preflight \
            --input "$PREFLIGHT_INPUT" \
            --out release/evidence/provenance/release-prerequisite-preflight.json
      - name: retain provenance + readiness + runner evidence
        # Named release-evidence-preflight so evidence-retention's
        # release-evidence-* download pattern picks it up. Contains the
        # validated production provenance, readiness attestation, runner lock,
        # and preflight inventory under release/evidence/. When merged into
        # target/evidence/ the provenance lands at
        # target/evidence/provenance/production-provenance.json.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-preflight
          path: release/evidence/
          if-no-files-found: warn
          retention-days: 365

  # 5. Retain raw logs + machine-readable evidence; final fail-on-skip gate.
  evidence-retention:
    needs: [tag-guard, verify-release, release-package, provenance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-guard.outputs.commit }}
          fetch-depth: 0
      - name: merge all release evidence
        # Downloads every release-evidence-* artifact (per-kind gate-results,
        # smoke-row receipts, and the production-provenance record from the
        # provenance job) into target/evidence for the finalizer.
        uses: actions/download-artifact@v4
        with:
          path: target/evidence
          pattern: release-evidence-*
          merge-multiple: true
      - name: finalize + bind canonical evidence index (fail-on-skip)
        # Validates every gate-result, then binds the plain gate index into the
        # canonical rutile.evidence-index.v1 schema via `xtask evidence bind`,
        # anchored to the validated production-provenance SHA-256. Fails closed
        # if any required gate is missing/failed/invalid, if the provenance is
        # missing/unreadable (non-empty path asserted by the release pipeline),
        # or if evidence bind rejects the index/provenance/source binding.
        # Gate validation failure prevents bind entirely.
        run: |
          bash scripts/ci/evidence-finalize.sh \
            --required release-package-macos,release-package-linux \
            --fail-on-dirty \
            --profile release \
            --provenance target/evidence/provenance/production-provenance.json \
            --job release-evidence
      - name: retain final release evidence (long retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-final
          path: |
            target/evidence/
            release/evidence/
          if-no-files-found: error
          retention-days: 365
