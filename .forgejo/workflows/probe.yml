name: probe
on: [push, pull_request]
jobs:
  p19-github-path:
    runs-on: [heavy]
    steps:
      - run: |
          echo "MARKER=via_env" >> "$GITHUB_ENV"
          mkdir -p /tmp/pathprobe && printf '#!/bin/sh\necho path-works\n' > /tmp/pathprobe/pathprobe && chmod +x /tmp/pathprobe/pathprobe
          echo "/tmp/pathprobe" >> "$GITHUB_PATH"
      - run: |
          echo "GITHUB_PATH contents: $(cat "$GITHUB_PATH" 2>/dev/null || echo missing)"
          echo "MARKER=$MARKER"
          PATHPROBE_OUT=$(pathprobe 2>&1 || echo "PATH-FAILED")
          echo "pathprobe: $PATHPROBE_OUT"
          if [ "$PATHPROBE_OUT" = "path-works" ]; then echo PATH_SUPPORTED; else echo PATH_BROKEN; fi
