name: probe
on: [push, pull_request]
jobs:
  p11-env-inputs:
    runs-on: [heavy]
    env:
      PROFILE: ${{ inputs.profile || 'pr' }}
    steps: [{run: "echo $PROFILE"}]
  p12-env-vars:
    runs-on: [heavy]
    env:
      FORGEJO_RUNNER_NAME: ${{ vars.FORGEJO_RUNNER_NAME || '' }}
    steps: [{run: "echo name=$FORGEJO_RUNNER_NAME"}]
  p13-rustup:
    runs-on: [heavy]
    steps:
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: ~/.cargo/bin/cargo --version
  p14-fetch-depth-0:
    runs-on: [heavy]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git log -1 --oneline
  p15-rustup-bootstrap:
    runs-on: [heavy]
    steps:
      - run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo --version && rustc --version
