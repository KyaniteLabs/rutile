name: probe
on: [push, pull_request]
jobs:
  p20-xtask-test-why:
    runs-on: [heavy]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: xtask test with reporting
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          report() {
            desc=$(grep -E "FAILED|panicked|error\[|^error" /tmp/probe.log | tail -3 | tr '\n' ' ' | cut -c1-135 | tr -d '"' | tr -d '\\')
            curl -s -f -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              --data "{\"state\":\"$1\",\"context\":\"p20-why\",\"description\":\"$desc\"}" \
              "https://git.kyanitelabs.tech/api/v1/repos/${REPO}/statuses/${SHA}" >/dev/null || true
          }
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0 >> /tmp/probe.log 2>&1
          . "$HOME/.cargo/env"
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update >> /tmp/probe.log 2>&1
          if cargo test -p xtask --locked >> /tmp/probe.log 2>&1; then
            report success
          else
            report failure
            exit 1
          fi
