name: probe
on: [push, pull_request]
jobs:
  p23-xtask-suite:
    runs-on: [heavy]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: xtask suite with reporting
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          post() {
            desc=$(grep -aE "FAILED|panicked|error" /tmp/probe.log | tail -2 | tr '\n' ' ' | tr -d '"' | tr -d '\\' | cut -c1-138)
            curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              --data "{\"state\":\"$1\",\"context\":\"p23-xtask\",\"description\":\"$desc\"}" \
              "https://git.kyanitelabs.tech/api/v1/repos/${REPO}/statuses/${SHA}" >/dev/null
          }
          : > /tmp/probe.log
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0 >> /tmp/probe.log 2>&1
          . "$HOME/.cargo/env"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update >> /tmp/probe.log 2>&1
          echo "== xtask all-targets serial (gate semantics)"
          if env RUST_TEST_THREADS=1 cargo test --locked -p xtask --all-targets >> /tmp/probe.log 2>&1; then
            echo "== now types/core/protocol"
            if cargo test --locked -p rutile-types -p rutile-core -p rutile-protocol >> /tmp/probe.log 2>&1; then
              post success
            else
              post failure; exit 1
            fi
          else
            post failure; exit 1
          fi
