name: probe
on: [push, pull_request]
jobs:
  p24-xtask-names:
    runs-on: [heavy]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: xtask failing test names
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          post() {
            desc=$(grep -a "FAILED" /tmp/probe.log | grep -a "^test " | head -4 | tr '\n' ' ' | head -c 130)
            payload=$(python3 -c "import json,sys; print(json.dumps({'state':sys.argv[1],'context':'p24-names','description':sys.argv[2]}))" "$1" "$desc")
            curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              --data "$payload" \
              "https://git.kyanitelabs.tech/api/v1/repos/${REPO}/statuses/${SHA}" >/dev/null
          }
          : > /tmp/probe.log
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0 >> /tmp/probe.log 2>&1
          . "$HOME/.cargo/env"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update >> /tmp/probe.log 2>&1
          env RUST_TEST_THREADS=1 cargo test --locked -p xtask --all-targets >> /tmp/probe.log 2>&1
          post failure
          exit 1
  p25-fuzz-reason:
    runs-on: [heavy]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: fuzz sequence with reporting
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          post() {
            desc=$(tail -3 /tmp/probe.log | tr '\n' ' ' | tr -d '"' | tr -d '\\' | cut -c1-138)
            curl -s -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              --data "{\"state\":\"$1\",\"context\":\"p25-fuzz\",\"description\":\"$desc\"}" \
              "https://git.kyanitelabs.tech/api/v1/repos/${REPO}/statuses/${SHA}" >/dev/null
          }
          : > /tmp/probe.log
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.88.0 >> /tmp/probe.log 2>&1
          . "$HOME/.cargo/env"
          echo "== toolchains" >> /tmp/probe.log
          rustup toolchain install 1.88.0 --profile minimal --no-self-update >> /tmp/probe.log 2>&1
          rustup toolchain install nightly-2026-07-01 --profile minimal --component llvm-tools-preview >> /tmp/probe.log 2>&1 || { post failure; exit 1; }
          echo "== cargo-fuzz install" >> /tmp/probe.log
          cargo install cargo-fuzz --version 0.13.2 --locked >> /tmp/probe.log 2>&1 || { post failure; exit 1; }
          echo "== gate fuzz stage" >> /tmp/probe.log
          bash scripts/ci/portable-gate.sh --stage fuzz --profile pr --job fuzz-smoke >> /tmp/probe.log 2>&1 || { post failure; exit 1; }
          post success
