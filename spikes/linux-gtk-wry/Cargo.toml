[package]
name = "linux-gtk-wry-spike"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "linux-gtk-wry-spike"
path = "src/main.rs"

[features]
default = []
linux-gtk = ["dep:gtk", "dep:sourceview4", "dep:wry"]
test-control = []

[dependencies]
rutile-protocol = { path = "../../crates/rutile-protocol", version = "=0.2.2" }
rutile-spike-support = { path = "../rutile-spike-support", version = "=0.2.2" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
sourceview4 = { version = "=0.5.0", optional = true }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"], optional = true }
