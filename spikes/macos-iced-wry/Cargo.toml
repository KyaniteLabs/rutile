[package]
name = "macos-iced-wry-spike"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "macos-iced-wry-spike"
path = "src/main.rs"

[features]
default = []
macos-iced = ["dep:iced_renderer", "dep:iced_widget", "dep:iced_winit", "dep:wry"]
test-control = []

[dependencies]
rutile-protocol = { path = "../../crates/rutile-protocol", version = "=0.2.3" }
rutile-spike-support = { path = "../rutile-spike-support", version = "=0.2.3" }

[target.'cfg(target_os = "macos")'.dependencies]
iced_winit = { version = "=0.14.0", optional = true }
iced_renderer = { version = "=0.14.0", features = ["tiny-skia"], optional = true }
iced_widget = { version = "=0.14.0", optional = true }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview", "protocol"], optional = true }
